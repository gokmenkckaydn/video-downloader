<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Downloader 2</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; min-height: 110px; padding: 8px; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 13px; }
  button { padding: 8px 16px; margin-top: 8px; margin-right: 8px; cursor: pointer; }
  .hint { color: #555; font-size: 14px; margin-bottom: 6px; }
  .count { color: #555; font-size: 13px; margin-top: 4px; min-height: 1em; }
  .error { color: #b00020; margin-top: 8px; }
  .info { margin-top: 12px; padding: 8px; background: #f5f5f5; }
  label { display: inline-block; margin-right: 12px; }
  #summary { margin-top: 16px; font-weight: 600; }
  .item { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .item .url { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .item .state { font-size: 13px; margin-top: 4px; }
  .item progress { width: 100%; height: 14px; margin-top: 4px; }
  .item.finished { border-color: #2e7d32; } .item.finished .state { color: #2e7d32; }
  .item.failed, .item.invalid, .item.cancelled { border-color: #c62828; }
  .item.failed .state, .item.invalid .state, .item.cancelled .state { color: #c62828; }
</style>
</head>
<body>
  <h1>Video Downloader 2</h1>
  <div class="hint">Paste one URL or many — one per line, separated by spaces/commas, or glued together (https://...https://...). Each URL is downloaded separately.</div>
  <textarea id="urls" placeholder="https://..."></textarea>
  <div id="count" class="count"></div>
  <div>
    <label>Quality:
      <select id="quality">
        <option value="best">best</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
      </select>
    </label>
    <label><input id="audioOnly" type="checkbox"> Audio only</label>
    <label>Audio format:
      <select id="audioFormat" disabled>
        <option value="m4a">m4a</option>
        <option value="mp3">mp3</option>
      </select>
    </label>
  </div>
  <button id="infoBtn">Get Info</button>
  <button id="downloadBtn">Download</button>
  <button id="cancelBtn" disabled>Cancel all</button>
  <div id="info" class="info" style="display:none"></div>
  <div id="error" class="error"></div>
  <div id="summary"></div>
  <div id="items"></div>

<script>
// Browsers allow only ~6 open HTTP/1.1 connections per origin, so SSE streams
// are opened a few at a time; the server buffers each job's events meanwhile.
const MAX_OPEN_STREAMS = 4;
let jobs = [];          // { url, jobId, el, state }
let pending = [];       // jobs whose event stream is not open yet
let openStreams = 0;

const $ = (id) => document.getElementById(id);
const showError = (msg) => { $('error').textContent = msg || ''; };

// Mirrors core/url_parsing.py closely enough for the live counter; the server
// does the authoritative split.
function countUrls(text) {
  const seen = new Set();
  for (const token of text.split(/\s+/)) {
    const pieces = token.split(/(?<!=)(?=https?:\/\/)/i);
    for (let p of pieces) {
      p = p.replace(/^["'`<>,;|]+|["'`<>,;|]+$/g, '');
      if (/^https?:\/\//i.test(p)) seen.add(p);
    }
  }
  return seen.size;
}

$('audioOnly').addEventListener('change', () => { $('audioFormat').disabled = !$('audioOnly').checked; });

$('urls').addEventListener('input', () => {
  const n = countUrls($('urls').value);
  $('count').textContent = n ? n + ' URL(s) detected' : '';
});
$('urls').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('downloadBtn').click(); }
});

$('infoBtn').onclick = async () => {
  showError('');
  const match = $('urls').value.match(/https?:\/\/\S+?(?=https?:\/\/|\s|$)/i);
  if (!match) { showError('Enter a URL first.'); return; }
  const resp = await fetch('/media-info?url=' + encodeURIComponent(match[0]));
  const data = await resp.json();
  if (!resp.ok) { showError(data.detail || 'Error'); return; }
  const infoDiv = $('info');
  infoDiv.style.display = 'block';
  infoDiv.textContent = data.title + ' (' + data.extractor +
    (data.duration_seconds ? ', ' + Math.round(data.duration_seconds) + 's' : '') + ')';
};

function renderItem(url) {
  const el = document.createElement('div');
  el.className = 'item';
  const urlDiv = document.createElement('div'); urlDiv.className = 'url'; urlDiv.textContent = url;
  const bar = document.createElement('progress'); bar.max = 100; bar.value = 0;
  const state = document.createElement('div'); state.className = 'state';
  el.append(urlDiv, bar, state);
  $('items').append(el);
  return el;
}

function setItem(job, cls, text, percent) {
  job.el.className = 'item ' + cls;
  job.el.querySelector('.state').textContent = text;
  const bar = job.el.querySelector('progress');
  if (percent !== undefined) bar.value = percent;
  if (cls === 'invalid') bar.style.display = 'none';
}

function updateSummary() {
  const real = jobs.filter(j => j.jobId);
  const done = real.filter(j => ['finished', 'failed', 'cancelled'].includes(j.state)).length;
  const ok = real.filter(j => j.state === 'finished').length;
  const invalid = jobs.length - real.length;
  let text = `${done}/${real.length} processed · ${ok} succeeded · ${done - ok} failed`;
  if (invalid) text += ` · ${invalid} invalid`;
  $('summary').textContent = text;
  if (done === real.length) $('cancelBtn').disabled = true;
}

function openNextStreams() {
  while (openStreams < MAX_OPEN_STREAMS && pending.length) {
    const job = pending.shift();
    openStreams++;
    const es = new EventSource('/downloads/' + job.jobId + '/events');
    es.onmessage = (e) => {
      const evt = JSON.parse(e.data);
      let pct;
      let label = evt.status;
      if (evt.total_bytes) {
        pct = (evt.downloaded_bytes / evt.total_bytes) * 100;
        label += ' ' + Math.round(pct) + '%';
      }
      job.state = 'running';
      setItem(job, 'running', label, pct);
    };
    es.addEventListener('done', async () => {
      es.close();
      openStreams--;
      const statusData = await (await fetch('/downloads/' + job.jobId)).json();
      job.state = statusData.status;
      if (statusData.error) {
        setItem(job, statusData.status, statusData.status + ': ' + statusData.error);
      } else {
        setItem(job, 'finished', 'done: ' + statusData.file_path, 100);
      }
      updateSummary();
      openNextStreams();
    });
  }
}

$('downloadBtn').onclick = async () => {
  showError('');
  const text = $('urls').value;
  const quality = $('quality').value;
  const audio_only = $('audioOnly').checked;
  const audio_format = $('audioFormat').value;
  const resp = await fetch('/downloads/batch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, quality, audio_only, audio_format }),
  });
  const data = await resp.json();
  if (!resp.ok) { showError(data.detail || 'Error'); return; }

  $('items').innerHTML = '';
  jobs = []; pending = [];
  for (const item of data.items) {
    const job = { url: item.url, jobId: item.job_id, el: renderItem(item.url), state: item.status };
    jobs.push(job);
    if (item.job_id) { setItem(job, 'queued', 'queued'); pending.push(job); }
    else setItem(job, 'invalid', 'invalid: ' + item.error);
  }
  if (data.duplicates) showError(data.duplicates + ' duplicate URL(s) ignored.');
  $('cancelBtn').disabled = !pending.length;
  updateSummary();
  openNextStreams();
};

$('cancelBtn').onclick = async () => {
  const active = jobs.filter(j => j.jobId && !['finished', 'failed', 'cancelled'].includes(j.state));
  await Promise.all(active.map(j => fetch('/downloads/' + j.jobId + '/cancel', { method: 'POST' })));
};
</script>
</body>
</html>
