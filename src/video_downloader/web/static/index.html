<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Downloader</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; margin-top: 8px; margin-right: 8px; cursor: pointer; }
  progress { width: 100%; height: 20px; margin-top: 12px; }
  .error { color: #b00020; margin-top: 8px; }
  .info { margin-top: 12px; padding: 8px; background: #f5f5f5; }
  label { display: inline-block; margin-right: 12px; }
</style>
</head>
<body>
  <h1>Video Downloader</h1>
  <input id="url" type="text" placeholder="https://...">
  <div>
    <label>Quality:
      <select id="quality">
        <option value="best">best</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="480p">480p</option>
      </select>
    </label>
    <label><input id="audioOnly" type="checkbox"> Audio only</label>
  </div>
  <button id="infoBtn">Get Info</button>
  <button id="downloadBtn">Download</button>
  <button id="cancelBtn" disabled>Cancel</button>
  <div id="info" class="info" style="display:none"></div>
  <progress id="progress" value="0" max="100" style="display:none"></progress>
  <div id="status"></div>
  <div id="error" class="error"></div>

<script>
let currentJobId = null;
let eventSource = null;

function showError(msg) {
  document.getElementById('error').textContent = msg || '';
}

document.getElementById('infoBtn').onclick = async () => {
  showError('');
  const url = document.getElementById('url').value;
  const resp = await fetch('/media-info?url=' + encodeURIComponent(url));
  const data = await resp.json();
  if (!resp.ok) { showError(data.detail || 'Error'); return; }
  const infoDiv = document.getElementById('info');
  infoDiv.style.display = 'block';
  infoDiv.textContent = data.title + ' (' + data.extractor +
    (data.duration_seconds ? ', ' + Math.round(data.duration_seconds) + 's' : '') + ')';
};

document.getElementById('downloadBtn').onclick = async () => {
  showError('');
  const url = document.getElementById('url').value;
  const quality = document.getElementById('quality').value;
  const audio_only = document.getElementById('audioOnly').checked;
  const resp = await fetch('/downloads', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, quality, audio_only }),
  });
  const data = await resp.json();
  if (!resp.ok) { showError(data.detail || 'Error'); return; }
  currentJobId = data.job_id;
  document.getElementById('cancelBtn').disabled = false;
  document.getElementById('progress').style.display = 'block';
  document.getElementById('status').textContent = 'starting...';

  eventSource = new EventSource('/downloads/' + currentJobId + '/events');
  eventSource.onmessage = (e) => {
    const evt = JSON.parse(e.data);
    document.getElementById('status').textContent = evt.status;
    if (evt.total_bytes) {
      document.getElementById('progress').value = (evt.downloaded_bytes / evt.total_bytes) * 100;
    }
  };
  eventSource.addEventListener('done', async () => {
    eventSource.close();
    document.getElementById('cancelBtn').disabled = true;
    const statusResp = await fetch('/downloads/' + currentJobId);
    const statusData = await statusResp.json();
    if (statusData.error) {
      showError(statusData.error);
      document.getElementById('status').textContent = 'failed';
    } else {
      document.getElementById('status').textContent = 'done: ' + statusData.file_path;
    }
  });
};

document.getElementById('cancelBtn').onclick = async () => {
  if (!currentJobId) return;
  await fetch('/downloads/' + currentJobId + '/cancel', { method: 'POST' });
};
</script>
</body>
</html>
